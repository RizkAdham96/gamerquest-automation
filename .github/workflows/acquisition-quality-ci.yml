name: Acquisition Quality CI

on:
  pull_request:
    paths:
      - "acquisition/**"
      - "requirements.txt"
      - ".github/workflows/acquisition-shadow.yml"
      - ".github/workflows/acquisition-quality-ci.yml"
  push:
    branches:
      - main
    paths:
      - "acquisition/**"
      - "requirements.txt"
      - ".github/workflows/acquisition-shadow.yml"
      - ".github/workflows/acquisition-quality-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Acquisition regression suite
        run: python -m pytest acquisition/test_engine.py acquisition/test_shadow_cli.py -v
