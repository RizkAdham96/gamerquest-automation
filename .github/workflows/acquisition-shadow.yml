name: GamerQuest Acquisition Shadow

on:
  push:
    paths:
      - "acquisition/engine.py"
      - "acquisition/run_shadow.py"
      - "acquisition/test_engine.py"
      - "acquisition/test_shadow_cli.py"
      - ".github/workflows/acquisition-shadow.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: gamerquest-acquisition-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run acquisition tests
        run: python -m pytest acquisition/test_engine.py acquisition/test_shadow_cli.py -v
      - name: Run News, SEO and Deals regressions
        if: github.event_name != 'schedule'
        env:
          GROQ_API_KEY: test-key
          TAVILY_API_KEY: test-key
        run: python -m pytest test_news_quality_guards.py trending_seo deals -q
      - name: Build shadow queue outside the repository
        run: |
          python -m acquisition.run_shadow \
            --output "${RUNNER_TEMP}/acquisition-shadow-queue.json"
      - name: Upload shadow queue artifact
        uses: actions/upload-artifact@v7
        with:
          name: acquisition-shadow-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/acquisition-shadow-queue.json
          if-no-files-found: error
          retention-days: 7
