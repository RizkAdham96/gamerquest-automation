name: GamerQuest Acquisition Shadow

on:
  workflow_dispatch:
  schedule:
    # Balanced production cadence: one acquisition shadow run per day.
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: gamerquest-acquisition-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build shadow queue outside the repository
        run: |
          python -m acquisition.run_shadow \
            --output "${RUNNER_TEMP}/acquisition-shadow-queue.json"
      - name: Upload shadow queue artifact
        uses: actions/upload-artifact@v7
        with:
          name: acquisition-shadow-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/acquisition-shadow-queue.json
          if-no-files-found: error
          retention-days: 3
