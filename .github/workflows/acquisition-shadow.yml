name: GamerQuest Acquisition Shadow

on:
  push:
    paths:
      - "acquisition/engine.py"
      - "acquisition/run_shadow.py"
      - "acquisition/test_engine.py"
      - "acquisition/test_shadow_cli.py"
      - ".github/workflows/acquisition-shadow.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: gamerquest-acquisition-writer
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run acquisition tests
        run: python -m pytest acquisition/test_engine.py acquisition/test_shadow_cli.py -v
      - name: Run News, SEO and Deals regressions
        if: github.event_name != 'schedule'
        env:
          GROQ_API_KEY: test-key
          TAVILY_API_KEY: test-key
        run: python -m pytest test_news_quality_guards.py trending_seo deals -q
      - name: Build shadow queue
        run: python -m acquisition.run_shadow
      - name: Commit shadow queue when changed
        run: |
          git config user.name "GamerQuest Acquisition Bot"
          git config user.email "actions@github.com"
          git add acquisition/shadow_queue.json
          if git diff --cached --quiet; then
            echo "No shadow queue changes to commit."
          else
            git commit -m "data: refresh acquisition shadow queue"
            git stash push --include-untracked -m "gamerquest-acquisition-pre-rebase" || true
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            git stash pop || true
          fi
