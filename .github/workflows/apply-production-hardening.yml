name: Apply Production Hardening

on:
  push:
    branches:
      - fix/production-hardening-2026-09-27
    paths:
      - ".github/workflows/apply-production-hardening.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: fix/production-hardening-2026-09-27
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Pillow requests pyyaml

      - name: Apply guarded production patch
        run: python scripts/apply_production_hardening.py

      - name: Verify Python and targeted regressions
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q groq_budget.py social tests/social
          python -m pytest test_groq_budget.py -q
          python tests/social/test_wordpress_publish.py
          python tests/social/test_prepare_publish.py
          python tests/social/test_publish_run.py
          python tests/social/test_meta_healthcheck.py

      - name: Verify workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
              print(f'YAML OK: {path}')
          PY

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit verified hardening
        run: |
          set -euo pipefail
          git config user.name "GamerQuest Hardening Bot"
          git config user.email "actions@github.com"
          git add -A
          git status --short
          git commit -m "fix: wire production hardening and remove runtime repo bloat"
          git push origin HEAD:fix/production-hardening-2026-09-27
