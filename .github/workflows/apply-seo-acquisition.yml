name: Verify SEO Acquisition Strategy

on:
  push:
    paths:
      - ".github/workflows/apply-seo-acquisition.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify News acquisition and quality guards
        env:
          GROQ_API_KEY: test-key
          TAVILY_API_KEY: test-key
        run: python -m pytest test_news_quality_guards.py -v
