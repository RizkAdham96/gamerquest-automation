name: Apply SEO Image Fix

on:
  push:
    branches:
      - fix/seo-featured-image
    paths:
      - tools/apply_seo_image_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply selector patch
        run: python tools/apply_seo_image_fix.py
      - name: Commit patched pipeline
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"
          git add trending_seo/pipeline.py
          if git diff --cached --quiet; then
            echo "No patch changes."
          else
            git commit -m "fix: accept relevant hashed SEO social images"
            git push
          fi
