name: Apply Social CTA Fix

on:
  push:
    branches:
      - fix/social-clean-cta
    paths:
      - tools/apply_social_cta_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python tools/apply_social_cta_fix.py
      - name: Commit social fix
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"
          git add social/render.py
          if git diff --cached --quiet; then
            echo "No social CTA changes."
          else
            git commit -m "fix: clean duplicate GamerQuest carousel CTA"
            git push
          fi
