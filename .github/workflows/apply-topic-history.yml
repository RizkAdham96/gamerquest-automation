name: Verify Persistent Topic History

on:
  push:
    paths:
      - ".github/workflows/apply-topic-history.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full News regression suite
        env:
          GROQ_API_KEY: test-key
          TAVILY_API_KEY: test-key
        run: |
          python -m pytest \
            test_news_image_generator.py \
            test_news_quality_guards.py \
            test_platform_classifier.py \
            test_platform_feed.py \
            -v
