name: Apply Persistent Topic History

on:
  push:
    paths:
      - ".github/workflows/apply-topic-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run corrected TDD migration
        run: python scripts/apply_topic_history_v2.py

      - name: Commit persistent topic history
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"
          git add automation.py test_news_quality_guards.py state/news_topic_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "SEO: keep persistent topic history"
            git push
          fi
