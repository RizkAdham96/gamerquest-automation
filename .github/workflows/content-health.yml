name: GamerQuest Content Health

on:
  workflow_dispatch:
  schedule:
    # Balanced monitoring cadence: four checks per day.
    - cron: "13 */6 * * *"

permissions:
  contents: read

jobs:
  check-content-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository state
        uses: actions/checkout@v7

      - name: Validate automation state
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          scored_path = Path("trending_seo/scored_topics.json")
          if not scored_path.exists():
              raise SystemExit("Trending SEO state missing: trending_seo/scored_topics.json")
          scored = json.loads(scored_path.read_text(encoding="utf-8"))
          if not isinstance(scored.get("topics"), list):
              raise SystemExit("Trending SEO scored_topics.json has invalid topics state.")
          print("Trending SEO state: OK")

          deals_path = Path("gamerquest-deals-feed.json")
          if not deals_path.exists():
              raise SystemExit("Deals feed missing: gamerquest-deals-feed.json")
          deals = json.loads(deals_path.read_text(encoding="utf-8"))
          generated_raw = deals.get("generated_at")
          if not generated_raw:
              raise SystemExit("Deals feed has no generated_at timestamp.")
          generated = datetime.fromisoformat(generated_raw.replace("Z", "+00:00"))
          if generated.tzinfo is None:
              generated = generated.replace(tzinfo=timezone.utc)
          deals_age = (
              datetime.now(timezone.utc) - generated.astimezone(timezone.utc)
          ).total_seconds() / 3600
          print(f"Deals feed age: {deals_age:.2f} hours")
          # Deals runs every 4h. Allow one delayed/missed slot plus scheduler margin
          # before declaring the feed stale, so health checks do not false-alarm
          # immediately before a healthy scheduled refresh.
          if deals_age > 10:
              raise SystemExit(f"Deals feed is stale: {deals_age:.2f} hours (limit 10h).")
          PY

      - name: Check live WordPress content and homepage visibility
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          USER_AGENT = "GamerQuest-Content-Health/3.0"

          def fetch_json(url):
              request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def fetch_text(url):
              request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode("utf-8", errors="replace")

          def latest_post(category_id, label, max_age_hours):
              url = (
                  "https://gamerquestfr.com/wp-json/wp/v2/posts"
                  f"?categories={category_id}&per_page=1&orderby=date&order=desc"
                  "&_fields=id,date,date_gmt,slug,link,title"
              )
              posts = fetch_json(url)
              if not posts:
                  raise SystemExit(f"No published {label} posts found.")
              latest = posts[0]
              published_raw = latest.get("date_gmt") or latest.get("date")
              if not published_raw:
                  raise SystemExit(f"Latest {label} post has no publish date.")
              published = datetime.fromisoformat(published_raw.replace("Z", "+00:00"))
              if published.tzinfo is None:
                  published = published.replace(tzinfo=timezone.utc)
              age_hours = (
                  datetime.now(timezone.utc) - published.astimezone(timezone.utc)
              ).total_seconds() / 3600
              print(f"Latest {label}: {latest.get('title', {}).get('rendered')}")
              print(f"{label} URL: {latest.get('link')}")
              print(f"{label} age: {age_hours:.2f} hours")
              if age_hours > max_age_hours:
                  raise SystemExit(
                      f"{label} publishing is stale: {age_hours:.2f} hours "
                      f"(limit {max_age_hours}h)."
                  )
              return latest

          latest_news = latest_post(2, "Actualités", 8)
          latest_review = latest_post(5, "Tests & Avis", 30)

          homepage = fetch_text("https://gamerquestfr.com/")
          for label, post in (("Actualités", latest_news), ("Tests & Avis", latest_review)):
              link = str(post.get("link") or "")
              if not link or link not in homepage:
                  raise SystemExit(
                      f"Latest {label} post is published but not visible on the homepage: {link}"
                  )
              print(f"Homepage visibility for latest {label}: OK")
          PY
