name: Evergreen SEO Branch CI

on:
  push:
    branches:
      - feat/evergreen-seo-engine

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SEO test dependencies
        run: pip install groq requests beautifulsoup4
      - name: Run evergreen SEO tests
        working-directory: trending_seo
        run: |
          python -m unittest \
            test_scorer.py \
            test_seo_engine.py \
            test_researcher.py \
            test_writer.py \
            test_featured_images.py \
            test_pipeline_publish_mode.py \
            -v
