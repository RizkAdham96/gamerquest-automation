name: GamerQuest Automation V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GamerQuest automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python automation.py

      - name: Save automation state and drafts
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"

          git add drafts/ state/ 2>/dev/null || true

          git commit -m "Update GamerQuest automation" || echo "No changes to commit"

          git push
