name: GamerQuest Automation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test news image generator
        run: |
          python -m pytest test_news_image_generator.py -v

      - name: Run GamerQuest automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python automation.py

      - name: Save drafts, rejections, state and news feed
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"

          git add drafts/ rejected/ state/ gamerquest-news-feed.json 2>/dev/null || true

          if [ -d "generated_news_images" ]; then
            git add generated_news_images/
          fi

          if git diff --cached --quiet; then
            echo "No new files or state changes to save."
          else
            git commit -m "GamerQuest automation update"
            git push
          fi
