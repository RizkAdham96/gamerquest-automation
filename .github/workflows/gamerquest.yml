name: GamerQuest Automation

on:
  workflow_dispatch:

  # Four evenly spaced News opportunities/day. Each run has enough budget
  # for a full-quality draft + verification while TPM pacing separates calls.
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: write

concurrency:
  group: gamerquest-repo-write-global
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News regression tests
        id: news_tests
        run: |
          python -m pytest \
            test_news_image_generator.py \
            test_news_quality_guards.py \
            test_platform_classifier.py \
            test_platform_feed.py \
            -v

      - name: Snapshot live news before run
        id: live_before
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request

          url = (
              "https://gamerquestfr.com/wp-json/wp/v2/posts"
              "?categories=2&per_page=1&orderby=date&order=desc"
              "&_fields=id,date_gmt,link,title"
          )
          req = urllib.request.Request(url, headers={"User-Agent": "GamerQuest-News-Diagnostic/1.0"})
          latest_id = "none"
          latest_date = "none"
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  posts = json.load(response)
              if posts:
                  latest_id = str(posts[0].get("id", "none"))
                  latest_date = str(posts[0].get("date_gmt", "none"))
          except Exception as exc:
              print(f"Pre-run WordPress snapshot unavailable: {exc}")

          print(f"Latest live post before run: id={latest_id} date={latest_date}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"post_id={latest_id}\n")
              f.write(f"date_gmt={latest_date}\n")
          PY

      - name: Reserve and persist shared Groq budget
        id: groq_budget
        run: |
          set -euo pipefail

          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"

          reservation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-news"
          output_file="${RUNNER_TEMP}/groq-budget-output"
          : > "${output_file}"

          for attempt in 1 2 3; do
            echo "Budget reservation attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            : > "${output_file}"
            python groq_budget.py reserve-run \
              --lane news \
              --tokens 11000 \
              --reservation-id "${reservation_id}" \
              --github-output "${output_file}"

            allowed="$(grep '^allowed=' "${output_file}" | tail -1 | cut -d= -f2- || true)"

            if [ "${allowed}" != "true" ]; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git add state/groq_budget.json
            git commit -m "budget: reserve News Groq allowance"

            if git push origin HEAD:main; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Shared budget state changed before push; recomputing safely."
          done

          echo "Unable to persist shared Groq reservation after 3 attempts." >&2
          exit 1

      - name: Shared Groq ceiling reached
        if: ${{ steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "News AI skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"
          echo "No prompt, article or image quality setting was reduced."

      - name: Run GamerQuest automation
        id: news_automation
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_RUN_TOKEN_BUDGET: ${{ steps.groq_budget.outputs.tokens }}
          GROQ_TPM_CEILING: "6000"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python automation.py

      - name: Diagnose news generation result
        id: news_diag
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess

          def changed(prefix):
              result = subprocess.run(
                  ["git", "status", "--porcelain", "--", prefix],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              return bool(result.stdout.strip())

          draft_changed = changed("drafts/")
          rejection_changed = changed("rejected/")
          feed_changed = changed("gamerquest-news-feed.json")
          image_changed = changed("generated_news_images/")

          if draft_changed:
              status = "draft_created"
              reason = "Automation produced a new or changed draft."
          elif rejection_changed:
              status = "rejected"
              reason = "Automation evaluated a candidate but rejected it; inspect rejected/ for the recorded quality reason."
          elif feed_changed:
              status = "feed_updated"
              reason = "News feed changed, but no draft/rejection file changed."
          elif image_changed:
              status = "image_only"
              reason = "Generated image state changed without a draft/rejection change."
          else:
              status = "no_candidate_change"
              reason = "Automation produced no draft, rejection, feed, or image change. Likely no eligible fresh candidate after source/quality filters."

          print(f"NEWS GENERATION STATUS: {status}")
          print(f"NEWS GENERATION REASON: {reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"status={status}\n")
              f.write(f"reason={reason}\n")
          PY

      - name: Classify Nintendo PlayStation and Xbox coverage
        if: ${{ always() && steps.news_automation.outcome != 'failure' }}
        run: python enrich_platforms.py

      - name: Save drafts, rejections, state, feed and images
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"

          git add drafts/ rejected/ state/ gamerquest-news-feed.json 2>/dev/null || true

          if [ -d "generated_news_images" ]; then
            git add generated_news_images/
          fi

          if git diff --cached --quiet; then
            echo "No new files or state changes to save."
          else
            git commit -m "GamerQuest automatic news update"
            git stash push --include-untracked -m "gamerquest-news-pre-rebase" || true
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            git stash pop || true
          fi

      - name: Wake WordPress news importer
        id: wordpress_wakeup
        if: ${{ steps.news_automation.outcome == 'success' }}
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --user-agent "GamerQuest-News-Wakeup/1.0" \
            https://gamerquestfr.com/ > /dev/null

      - name: Verify live publication recover importer and report P0 status
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          before_id = "${{ steps.live_before.outputs.post_id }}" or "none"
          tests_outcome = "${{ steps.news_tests.outcome }}".strip() or "skipped"
          budget_allowed = "${{ steps.groq_budget.outputs.allowed }}" == "true"
          budget_reason = "${{ steps.groq_budget.outputs.reason }}".strip()
          automation_outcome = "${{ steps.news_automation.outcome }}".strip() or "skipped"
          generation_status = "${{ steps.news_diag.outputs.status }}".strip() or "unknown"
          generation_reason = "${{ steps.news_diag.outputs.reason }}".strip()
          wake_outcome = "${{ steps.wordpress_wakeup.outcome }}".strip() or "skipped"

          api_url = (
              "https://gamerquestfr.com/wp-json/wp/v2/posts"
              "?categories=2&per_page=1&orderby=date&order=desc"
              "&_fields=id,date_gmt,link,title"
          )
          home_url = "https://gamerquestfr.com/"

          def fetch_latest():
              req = urllib.request.Request(
                  api_url,
                  headers={"User-Agent": "GamerQuest-News-Diagnostic/1.0"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  posts = json.load(response)
              return posts[0] if posts else None

          def wake_importer(label):
              req = urllib.request.Request(
                  home_url,
                  headers={"User-Agent": f"GamerQuest-News-Recovery/{label}"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read(1)
              print(f"Importer recovery wake {label} completed.")

          latest = None
          fetch_error = None
          for attempt in range(3):
              try:
                  latest = fetch_latest()
                  fetch_error = None
                  if latest and str(latest.get("id")) != before_id:
                      break
              except Exception as exc:
                  fetch_error = str(exc)
              if attempt < 2:
                  time.sleep(10)

          changed = bool(latest and str(latest.get("id")) != before_id)
          recovery_attempted = False

          # A produced draft with no live WordPress change is a recoverable importer
          # problem. Retry the same wake mechanism twice before declaring P0 failure.
          if (
              not changed
              and generation_status == "draft_created"
              and automation_outcome == "success"
          ):
              recovery_attempted = True
              for attempt in range(1, 3):
                  try:
                      wake_importer(str(attempt))
                  except Exception as exc:
                      print(f"Importer recovery wake {attempt} failed: {exc}")
                  time.sleep(8)
                  try:
                      latest = fetch_latest()
                      fetch_error = None
                  except Exception as exc:
                      fetch_error = str(exc)
                      latest = None
                  if latest and str(latest.get("id")) != before_id:
                      changed = True
                      break

          age_hours = None
          if latest and latest.get("date_gmt"):
              try:
                  published = datetime.fromisoformat(
                      str(latest["date_gmt"]).replace("Z", "+00:00")
                  )
                  if published.tzinfo is None:
                      published = published.replace(tzinfo=timezone.utc)
                  age_hours = (
                      datetime.now(timezone.utc)
                      - published.astimezone(timezone.utc)
                  ).total_seconds() / 3600
              except Exception as exc:
                  print(f"Could not calculate live article age: {exc}")

          stale = age_hours is not None and age_hours > 24

          if tests_outcome == "failure":
              result = "FAILED"
              reason = "News regression tests failed; production run is unsafe."
          elif latest is None:
              result = "FAILED"
              reason = f"Could not verify the live WordPress news feed: {fetch_error or 'no posts returned'}"
          elif changed:
              result = "PUBLISHED"
              reason = "A new Actualités post appeared on WordPress during this run."
              if recovery_attempted:
                  reason += " The automatic importer recovery wake was required."
          elif not budget_allowed:
              if stale:
                  result = "FAILED"
                  reason = (
                      f"Latest Actualités is {age_hours:.2f} hours old and the News run "
                      f"could not execute because the Groq budget was unavailable: "
                      f"{budget_reason or 'no reason returned'}"
                  )
              else:
                  result = "SKIPPED"
                  reason = f"Groq budget unavailable: {budget_reason or 'no reason returned'}"
          elif automation_outcome == "failure":
              result = "FAILED"
              reason = "automation.py failed before a publishable news item completed."
          elif stale:
              result = "FAILED"
              if generation_status == "draft_created":
                  reason = (
                      f"A draft was created but WordPress still did not publish it after automatic "
                      f"importer recovery; latest Actualités is {age_hours:.2f} hours old."
                  )
              elif generation_status == "rejected":
                  reason = (
                      f"No new article was published because the candidate was rejected and the "
                      f"latest Actualités is now {age_hours:.2f} hours old. {generation_reason}"
                  )
              else:
                  reason = (
                      f"No publishable fresh candidate was produced and the latest Actualités is "
                      f"{age_hours:.2f} hours old. {generation_reason}"
                  )
          elif wake_outcome == "failure" and generation_status == "draft_created":
              result = "FAILED"
              reason = "A draft was created but the WordPress importer wake-up failed."
          elif generation_status == "draft_created":
              result = "WAITING_IMPORT"
              reason = "A draft was created, but WordPress did not expose a new live post within the recovery window; live content is still under 24 hours old."
          elif generation_status == "rejected":
              result = "SKIPPED"
              reason = generation_reason
          else:
              result = "SKIPPED"
              reason = generation_reason or "No publishable fresh candidate was produced."

          latest_id = str(latest.get("id")) if latest else "none"
          latest_link = str(latest.get("link")) if latest else "none"
          age_text = f"{age_hours:.2f}h" if age_hours is not None else "unknown"
          print(f"NEWS RESULT: {result}")
          print(f"NEWS REASON: {reason}")
          print(f"LIVE POST: {latest_id} {latest_link}")
          print(f"LIVE AGE: {age_text}")
          print(f"IMPORTER RECOVERY ATTEMPTED: {recovery_attempted}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("## GamerQuest News result\n")
                  f.write(f"**{result}**\n\n")
                  f.write(f"{reason}\n\n")
                  f.write(f"Generation: `{generation_status}`\n\n")
                  f.write(f"automation.py: `{automation_outcome}`\n\n")
                  f.write(f"WordPress wake-up: `{wake_outcome}`\n\n")
                  f.write(f"Importer recovery attempted: `{recovery_attempted}`\n\n")
                  f.write(f"Latest live article age: `{age_text}`\n\n")
                  f.write(f"Latest live post: {latest_link}\n")

          if result == "FAILED":
              raise SystemExit(1)
          PY
