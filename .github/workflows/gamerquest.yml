name: GamerQuest Automation

on:
  workflow_dispatch:

  # Six evenly spaced News opportunities/day. The shared Groq ceiling can
  # still skip a run before any API call if the daily budget is exhausted.
  schedule:
    - cron: "7 */4 * * *"

permissions:
  contents: write

concurrency:
  # ONE Groq workflow at a time across News, SEO and Social.
  group: gamerquest-groq-global
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News regression tests
        run: |
          python -m pytest \
            test_news_image_generator.py \
            test_news_quality_guards.py \
            test_platform_classifier.py \
            test_platform_feed.py \
            -v

      - name: Reserve shared Groq budget
        id: groq_budget
        run: |
          python groq_budget.py reserve-run \
            --lane news \
            --tokens 8000 \
            --reservation-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-news" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Persist Groq budget reservation before AI calls
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        run: |
          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"
          git add state/groq_budget.json
          git commit -m "budget: reserve News Groq allowance" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Shared Groq ceiling reached
        if: ${{ steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "News AI skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"
          echo "No prompt, article or image quality setting was reduced."

      - name: Run GamerQuest automation
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_RUN_TOKEN_BUDGET: ${{ steps.groq_budget.outputs.tokens }}
          GROQ_TPM_CEILING: "6000"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python automation.py

      - name: Classify Nintendo PlayStation and Xbox coverage
        run: |
          python enrich_platforms.py

      - name: Save drafts, rejections, state, feed and images
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"

          git add drafts/ rejected/ state/ gamerquest-news-feed.json 2>/dev/null || true

          if [ -d "generated_news_images" ]; then
            git add generated_news_images/
          fi

          if git diff --cached --quiet; then
            echo "No new files or state changes to save."
          else
            git commit -m "GamerQuest automatic news update"
            git stash push --include-untracked -m "gamerquest-news-pre-rebase" || true
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            git stash pop || true
          fi

      - name: Wake WordPress news importer
        if: success()
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --user-agent "GamerQuest-News-Wakeup/1.0" \
            https://gamerquestfr.com/ > /dev/null
