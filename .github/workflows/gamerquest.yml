name: GamerQuest Automation

on:
  workflow_dispatch:

  # Four evenly spaced News opportunities/day. Each run has enough budget
  # for a full-quality draft + verification while TPM pacing separates calls.
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: write

concurrency:
  # ONE Groq workflow at a time across News, SEO and Social.
  group: gamerquest-groq-global
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News regression tests
        run: |
          python -m pytest \
            test_news_image_generator.py \
            test_news_quality_guards.py \
            test_platform_classifier.py \
            test_platform_feed.py \
            -v

      - name: Reserve and persist shared Groq budget
        id: groq_budget
        run: |
          set -euo pipefail

          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"

          reservation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-news"
          output_file="${RUNNER_TEMP}/groq-budget-output"
          : > "${output_file}"

          for attempt in 1 2 3; do
            echo "Budget reservation attempt ${attempt}/3"

            # Always reserve against the newest shared state. If another bot
            # committed state while this run was waiting, discard only this
            # runner's unpushed copy and recompute from origin/main.
            git fetch origin main
            git reset --hard origin/main

            : > "${output_file}"
            python groq_budget.py reserve-run \
              --lane news \
              --tokens 11000 \
              --reservation-id "${reservation_id}" \
              --github-output "${output_file}"

            allowed="$(grep '^allowed=' "${output_file}" | tail -1 | cut -d= -f2- || true)"

            if [ "${allowed}" != "true" ]; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git add state/groq_budget.json
            git commit -m "budget: reserve News Groq allowance"

            if git push origin HEAD:main; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Shared budget state changed before push; recomputing safely."
          done

          echo "Unable to persist shared Groq reservation after 3 attempts." >&2
          exit 1

      - name: Shared Groq ceiling reached
        if: ${{ steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "News AI skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"
          echo "No prompt, article or image quality setting was reduced."

      - name: Run GamerQuest automation
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_RUN_TOKEN_BUDGET: ${{ steps.groq_budget.outputs.tokens }}
          GROQ_TPM_CEILING: "6000"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python automation.py

      - name: Classify Nintendo PlayStation and Xbox coverage
        run: |
          python enrich_platforms.py

      - name: Save drafts, rejections, state, feed and images
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"

          git add drafts/ rejected/ state/ gamerquest-news-feed.json 2>/dev/null || true

          if [ -d "generated_news_images" ]; then
            git add generated_news_images/
          fi

          if git diff --cached --quiet; then
            echo "No new files or state changes to save."
          else
            git commit -m "GamerQuest automatic news update"
            git stash push --include-untracked -m "gamerquest-news-pre-rebase" || true
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            git stash pop || true
          fi

      - name: Wake WordPress news importer
        if: success()
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --user-agent "GamerQuest-News-Wakeup/1.0" \
            https://gamerquestfr.com/ > /dev/null
