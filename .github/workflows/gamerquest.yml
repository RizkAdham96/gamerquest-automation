name: GamerQuest Article Automation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate GamerQuest draft
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python automation.py

      - name: Commit generated draft
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"
          git add drafts/
          git commit -m "Add automated GamerQuest draft" || echo "No changes to commit"
          git push
