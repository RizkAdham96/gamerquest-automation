name: GamerQuest One-Time Live Social Test

on:
  push:
    paths:
      - ".github/workflows/live-social-test-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-live-social-test:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current production social workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run social-test.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f publish_to_meta=true
