name: Meta Credentials Smoke Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/meta-credentials-smoke-once.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Instagram and Facebook Graph access
        env:
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          version = "v26.0"

          def check(label, object_id, token, fields):
              if not object_id or not token:
                  raise SystemExit(f"{label}: missing ID or token secret")
              params = urllib.parse.urlencode({"fields": fields, "access_token": token})
              url = f"https://graph.facebook.com/{version}/{object_id}?{params}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(body)
                      message = payload.get("error", {}).get("message", body)
                      code = payload.get("error", {}).get("code")
                  except Exception:
                      message, code = body, None
                  raise SystemExit(f"{label}: FAILED HTTP {error.code} code={code} message={message}")
              returned_id = str(payload.get("id", ""))
              if returned_id != str(object_id):
                  raise SystemExit(f"{label}: returned unexpected object id")
              public = {k: v for k, v in payload.items() if k != "access_token"}
              print(f"{label}: OK")
              print(json.dumps(public, ensure_ascii=False))

          check("Instagram", os.environ.get("META_IG_USER_ID", ""), os.environ.get("META_IG_ACCESS_TOKEN", ""), "id,username")
          check("Facebook Page", os.environ.get("META_PAGE_ID", ""), os.environ.get("META_FB_PAGE_ACCESS_TOKEN", ""), "id,name")
          print("META_CREDENTIALS_SMOKE_PASSED")
          PY
