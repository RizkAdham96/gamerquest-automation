name: News Quality CI

on:
  pull_request:
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/gamerquest.yml"
      - ".github/workflows/news-quality-ci.yml"
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/gamerquest.yml"
      - ".github/workflows/news-quality-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run News regression suite
        env:
          GROQ_API_KEY: test-key
          TAVILY_API_KEY: test-key
        run: |
          python -m pytest \
            test_groq_budget.py \
            test_news_image_generator.py \
            test_news_quality_guards.py \
            test_platform_classifier.py \
            test_platform_feed.py \
            -v
