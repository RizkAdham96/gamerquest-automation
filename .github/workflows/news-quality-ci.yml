name: News Quality CI

on:
  push:
    paths:
      - "automation.py"
      - "groq_budget.py"
      - "test_groq_budget.py"
      - "test_news_quality_guards.py"
      - ".github/workflows/news-quality-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run News quality tests
        env:
          GROQ_API_KEY: test-key
          TAVILY_API_KEY: test-key
        run: python -m pytest test_groq_budget.py test_news_quality_guards.py -v
