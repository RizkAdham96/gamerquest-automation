name: GamerQuest News Runtime Validation

on:
  push:
    paths:
      - ".github/workflows/news-runtime-validation.yml"

permissions:
  contents: write

concurrency:
  group: gamerquest-news-writer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run News regression tests
        run: |
          python -m pytest test_news_image_generator.py test_news_quality_guards.py test_platform_classifier.py test_platform_feed.py -v
      - name: Run GamerQuest automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python automation.py
      - name: Classify platform coverage
        run: python enrich_platforms.py
      - name: Save news state and feed
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"
          git add drafts/ rejected/ state/ gamerquest-news-feed.json 2>/dev/null || true
          if [ -d "generated_news_images" ]; then git add generated_news_images/; fi
          if git diff --cached --quiet; then
            echo "No new files or state changes to save."
          else
            git commit -m "Validate bounded News runtime"
            git stash push --include-untracked -m "news-runtime-validation" || true
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            git stash pop || true
          fi
      - name: Wake WordPress news importer
        if: success()
        run: |
          curl --fail --silent --show-error --location --max-time 30 --user-agent "GamerQuest-News-Runtime-Validation/1.0" https://gamerquestfr.com/ > /dev/null
