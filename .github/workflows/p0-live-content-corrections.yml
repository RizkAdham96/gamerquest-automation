name: P0 Live Content Corrections

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/fix_p0_live_content.py"
      - ".github/workflows/p0-live-content-corrections.yml"

permissions:
  contents: read

jobs:
  correct-live-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Correct verified live factual errors
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/fix_p0_live_content.py
