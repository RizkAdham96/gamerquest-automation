name: P0 News Production Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p0-news-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run real News production engine without committing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python automation.py
      - name: Require fresh News output
        run: |
          CHANGES="$(git status --porcelain -- drafts/ gamerquest-news-feed.json state/news_topic_history.json)"
          echo "$CHANGES"
          test -n "$CHANGES"
