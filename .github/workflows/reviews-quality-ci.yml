name: Reviews Quality CI

on:
  pull_request:
    paths:
      - "reviews/**"
      - "requirements.txt"
      - ".github/workflows/reviews.yml"
      - ".github/workflows/reviews-quality-ci.yml"
  push:
    branches:
      - main
    paths:
      - "reviews/**"
      - "requirements.txt"
      - ".github/workflows/reviews.yml"
      - ".github/workflows/reviews-quality-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Tests & Avis regression suite
        run: python -m pytest reviews/test_reviews.py -q
