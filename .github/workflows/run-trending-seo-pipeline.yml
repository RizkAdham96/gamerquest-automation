name: Run Trending SEO Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamerquest-trending-seo
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Run safe Trending SEO pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python trending_seo/pipeline.py

      - name: Save Trending SEO state
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"

          git add trending_seo/scored_topics.json 2>/dev/null || true
          git add trending_seo/research_results.json 2>/dev/null || true
          git add trending_seo/pipeline_result.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No Trending SEO state changes to save."
          else
            git commit -m "Update Trending SEO pipeline state"
            git push
          fi
