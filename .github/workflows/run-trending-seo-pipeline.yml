name: Run Trending SEO Pipeline

on:
  workflow_dispatch:
  schedule:
    # Two full-quality SEO guide opportunities/day. Shared budgeting preserves
    # the News/Social reserve without shrinking the SEO generation budget.
    - cron: "43 2,14 * * *"

permissions:
  contents: write

concurrency:
  # Serialize repository/state writers. This prevents bots from rebasing over
  # each other's generated state while preserving every queued run.
  group: gamerquest-repo-write-global
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install groq requests beautifulsoup4

      - name: Validate SEO production configuration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in GROQ_API_KEY WP_URL WP_USERNAME WP_APP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required SEO production secret: ${name}" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "SEO stopped before Groq budget reservation; no quota/state was consumed." >&2
            exit 1
          fi
          echo "SEO production configuration is present."

      - name: Reserve and persist shared Groq budget
        id: groq_budget
        run: |
          set -euo pipefail

          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"

          reservation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-seo"
          output_file="${RUNNER_TEMP}/groq-budget-output"
          : > "${output_file}"

          for attempt in 1 2 3; do
            echo "SEO budget reservation attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            : > "${output_file}"
            python groq_budget.py reserve-run \
              --lane seo \
              --tokens 10000 \
              --reservation-id "${reservation_id}" \
              --github-output "${output_file}"

            allowed="$(grep '^allowed=' "${output_file}" | tail -1 | cut -d= -f2- || true)"

            if [ "${allowed}" != "true" ]; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git add state/groq_budget.json
            git commit -m "budget: reserve SEO Groq allowance"

            if git push origin HEAD:main; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Shared budget state changed before SEO push; recomputing safely."
          done

          echo "Unable to persist SEO Groq reservation after 3 attempts." >&2
          exit 1

      - name: Refill fresh gaming SEO topics
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        continue-on-error: true
        run: |
          # Discovery is token-free. A source outage must not strand a
          # successfully persisted AI reservation; the pipeline can safely
          # continue with the existing topic inventory.
          python trending_seo/discover_topics.py

      - name: Shared Groq ceiling reached
        if: ${{ steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "SEO AI skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"
          echo "SEO quality gates remain unchanged."

      - name: Run Trending SEO pipeline with automatic publishing
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_RUN_TOKEN_BUDGET: ${{ steps.groq_budget.outputs.tokens }}
          GROQ_TPM_CEILING: "6000"
          GROQ_USAGE_FILE: ${{ runner.temp }}/groq-usage-seo.json
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python trending_seo/pipeline.py

      - name: Save Trending SEO state
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"

          git add trending_seo/intel/topics.json 2>/dev/null || true
          git add trending_seo/scored_topics.json 2>/dev/null || true
          git add trending_seo/research_results.json 2>/dev/null || true
          git add trending_seo/pipeline_result.json 2>/dev/null || true
          git add trending_seo/seo_intent_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No Trending SEO state changes to save."
          else
            git commit -m "Update Trending SEO pipeline state"
            git stash push --include-untracked -m "gamerquest-trending-seo-pre-rebase" || true
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            git stash pop || true
          fi

      - name: Reconcile shared Groq budget (SEO)
        if: ${{ always() && steps.groq_budget.outputs.allowed == 'true' }}
        env:
          GROQ_USAGE_FILE: ${{ runner.temp }}/groq-usage-seo.json
        shell: bash
        run: |
          set -euo pipefail
          reservation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-seo"
          used_tokens="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["GROQ_USAGE_FILE"])
          used = 0
          if path.exists():
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  used = max(0, int(payload.get("estimated_tokens", 0) or 0))
              except Exception as exc:
                  print(f"Usage file unreadable; keeping reservation conservative: {exc}", file=__import__('sys').stderr)
                  raise SystemExit(2)
          print(used)
          PY
          )"

          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"

          for attempt in 1 2 3; do
            echo "SEO budget reconciliation attempt ${attempt}/3; used=${used_tokens}"
            git fetch origin main
            git reset --hard origin/main

            RESERVATION_ID="${reservation_id}" USED_TOKENS="${used_tokens}" python - <<'PY'
          import os
          from groq_budget import reconcile_run

          result = reconcile_run(
              os.environ["RESERVATION_ID"],
              int(os.environ["USED_TOKENS"]),
          )
          print(
              "Groq reconciliation: "
              f"reconciled={result['reconciled']} "
              f"used={result['used_tokens']} "
              f"released={result['released_tokens']} "
              f"reason={result['reason']}"
          )
          PY

            git add state/groq_budget.json
            if git diff --cached --quiet; then
              echo "No Groq budget state change to persist."
              exit 0
            fi
            git commit -m "budget: reconcile SEO Groq allowance"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Shared budget state changed before reconciliation push; retrying safely."
          done

          echo "Unable to persist SEO Groq reconciliation after 3 attempts." >&2
          exit 1
