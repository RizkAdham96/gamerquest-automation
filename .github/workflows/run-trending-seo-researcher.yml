name: Run Trending SEO Researcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamerquest-groq-global
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Reserve and persist shared Groq budget
        id: groq_budget
        run: |
          set -euo pipefail

          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"

          reservation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-seo-researcher"
          output_file="${RUNNER_TEMP}/groq-budget-output"
          : > "${output_file}"

          for attempt in 1 2 3; do
            echo "SEO researcher budget reservation attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            : > "${output_file}"
            python groq_budget.py reserve-run \
              --lane seo \
              --tokens 3000 \
              --reservation-id "${reservation_id}" \
              --github-output "${output_file}"

            allowed="$(grep '^allowed=' "${output_file}" | tail -1 | cut -d= -f2- || true)"

            if [ "${allowed}" != "true" ]; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git add state/groq_budget.json
            git commit -m "budget: reserve SEO researcher Groq allowance"

            if git push origin HEAD:main; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Shared budget state changed before push; recomputing safely."
          done

          echo "Unable to persist SEO researcher Groq reservation after 3 attempts." >&2
          exit 1

      - name: Shared Groq ceiling reached
        if: ${{ steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "Research AI skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"

      - name: Show research summary
        run: |
          python - <<'PY'
          import json

          path = "trending_seo/research_results.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("=" * 60)
          print("GAMERQUEST TRENDING SEO — RESEARCH SUMMARY")
          print("=" * 60)

          for topic in data.get("topics", []):
              print()
              print("TOPIC:", topic.get("topic"))
              print("SEO SCORE:", topic.get("seo_score"))
              print("STATUS:", topic.get("research_status"))

              source_summary = topic.get("source_summary", {})
              verification = topic.get("verification_summary", {})

              print(
                  "SOURCES:",
                  source_summary.get("usable_sources", 0),
                  "usable /",
                  source_summary.get("total_sources", 0),
                  "total"
              )

              print(
                  "CONFIRMED CLAIMS:",
                  verification.get("confirmed", 0)
              )

              print(
                  "BLOCKED CLAIMS:",
                  verification.get("blocked", 0)
              )

              print(
                  "USABLE EVIDENCE:",
                  verification.get("usable_evidence_sources", 0)
              )

              print("-" * 60)

              for claim in topic.get("claims", []):
                  print(
                      claim.get("status"),
                      "-",
                      claim.get("claim")
                  )

                  sources = claim.get("sources", [])

                  for source in sources:
                      print("   SOURCE:", source)

                  reason = claim.get("verification_reason")

                  if reason:
                      print("   REASON:", reason)

          print()
          print("=" * 60)
          PY

      - name: Commit research results
        run: |
          git config user.name "GamerQuest Automation"
          git config user.email "actions@github.com"

          git add trending_seo/research_results.json

          if git diff --cached --quiet; then
            echo "No research changes to commit."
          else
            git commit -m "Update Trending SEO verified research"
            git push
          fi
