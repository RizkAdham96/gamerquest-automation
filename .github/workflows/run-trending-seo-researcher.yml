name: Run Trending SEO Researcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamerquest-groq-global
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Reserve shared Groq budget
        id: groq_budget
        run: |
          python groq_budget.py reserve-run \
            --lane seo \
            --tokens 3000 \
            --reservation-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-seo-research" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Persist Groq budget reservation before AI calls
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        run: |
          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"
          git add state/groq_budget.json
          git commit -m "budget: reserve SEO research allowance" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Run Trending SEO researcher
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_RUN_TOKEN_BUDGET: ${{ steps.groq_budget.outputs.tokens }}
          GROQ_TPM_CEILING: "6000"
        run: |
          python trending_seo/researcher.py

      - name: Shared Groq ceiling reached
        if: ${{ steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "Research AI skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"

      - name: Show research summary
        run: |
          python - <<'PY'
          import json

          path = "trending_seo/research_results.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("=" * 60)
          print("GAMERQUEST TRENDING SEO — RESEARCH SUMMARY")
          print("=" * 60)

          for topic in data.get("topics", []):
              print()
              print("TOPIC:", topic.get("topic"))
              print("SEO SCORE:", topic.get("seo_score"))
              print("STATUS:", topic.get("research_status"))

              source_summary = topic.get("source_summary", {})
              verification = topic.get("verification_summary", {})

              print(
                  "SOURCES:",
                  source_summary.get("usable_sources", 0),
                  "usable /",
                  source_summary.get("total_sources", 0),
                  "total"
              )

              print(
                  "CONFIRMED CLAIMS:",
                  verification.get("confirmed", 0)
              )

              print(
                  "BLOCKED CLAIMS:",
                  verification.get("blocked", 0)
              )

              print(
                  "USABLE EVIDENCE:",
                  verification.get("usable_evidence_sources", 0)
              )

              print("-" * 60)

              for claim in topic.get("claims", []):
                  print(
                      claim.get("status"),
                      "-",
                      claim.get("claim")
                  )

                  sources = claim.get("sources", [])

                  for source in sources:
                      print("   SOURCE:", source)

                  reason = claim.get("verification_reason")

                  if reason:
                      print("   REASON:", reason)

          print()
          print("=" * 60)
          PY

      - name: Commit research results
        run: |
          git config user.name "GamerQuest Automation"
          git config user.email "actions@github.com"

          git add trending_seo/research_results.json

          if git diff --cached --quiet; then
            echo "No research changes to commit."
          else
            git commit -m "Update Trending SEO verified research"
            git push
          fi
