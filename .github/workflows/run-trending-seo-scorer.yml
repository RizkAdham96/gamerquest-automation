name: Run Trending SEO Scorer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamerquest-repo-write-global
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Run Trending SEO scorer
        run: |
          # Production scoring is deterministic/local and intentionally has
          # no GROQ_API_KEY, so this workflow cannot spend AI tokens.
          python trending_seo/scorer.py

      - name: Commit scoring results
        run: |
          git config user.name "GamerQuest Automation"
          git config user.email "actions@github.com"

          git add trending_seo/scored_topics.json

          if git diff --cached --quiet; then
            echo "No new scoring results to commit."
          else
            git commit -m "Update Trending SEO scores"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
