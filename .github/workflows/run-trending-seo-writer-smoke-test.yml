name: Run Trending SEO Writer Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Run real Writer V3 Groq smoke test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python trending_seo/writer_smoke_test.py
