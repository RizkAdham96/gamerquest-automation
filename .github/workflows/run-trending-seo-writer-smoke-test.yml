name: Run Trending SEO Writer Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize repository/state writers. This prevents bots from rebasing over
  # each other's generated state while preserving every queued run.
  group: gamerquest-repo-write-global
  cancel-in-progress: false

jobs:
  writer-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Reserve and persist shared Groq budget
        id: groq_budget
        run: |
          set -euo pipefail

          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"

          reservation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-seo-writer-smoke"
          output_file="${RUNNER_TEMP}/groq-budget-output"
          : > "${output_file}"

          for attempt in 1 2 3; do
            echo "SEO writer smoke budget reservation attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            : > "${output_file}"
            python groq_budget.py reserve-run \
              --lane manual \
              --tokens 4000 \
              --reservation-id "${reservation_id}" \
              --github-output "${output_file}"

            allowed="$(grep '^allowed=' "${output_file}" | tail -1 | cut -d= -f2- || true)"

            if [ "${allowed}" != "true" ]; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git add state/groq_budget.json
            git commit -m "budget: reserve SEO writer smoke Groq allowance"

            if git push origin HEAD:main; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Shared budget state changed before push; recomputing safely."
          done

          echo "Unable to persist SEO writer smoke Groq reservation after 3 attempts." >&2
          exit 1

      - name: Shared Groq ceiling reached
        if: ${{ steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "Manual writer smoke test skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"
