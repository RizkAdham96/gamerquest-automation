name: SEO Production Smoke Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seo-production-smoke-once.yml

permissions:
  contents: write

concurrency:
  group: gamerquest-trending-seo
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests beautifulsoup4
      - name: Run Evergreen SEO regression tests
        working-directory: trending_seo
        run: |
          python -m unittest \
            test_scorer.py \
            test_seo_engine.py \
            test_researcher.py \
            test_evergreen_research.py \
            test_writer.py \
            test_featured_images.py \
            test_evergreen_pipeline.py \
            test_pipeline_research_gate.py \
            test_pipeline_publish_mode.py \
            -v
      - name: Run SEO production smoke
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python trending_seo/pipeline.py
      - name: Save SEO smoke state
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"
          git add trending_seo/scored_topics.json 2>/dev/null || true
          git add trending_seo/research_results.json 2>/dev/null || true
          git add trending_seo/pipeline_result.json 2>/dev/null || true
          git add trending_seo/seo_intent_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No SEO smoke state changes to save."
          else
            git commit -m "Update SEO production smoke state"
            git push
          fi
