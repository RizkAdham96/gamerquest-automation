name: SEO Quality CI

on:
  pull_request:
    paths:
      - "trending_seo/**"
      - ".github/workflows/run-trending-seo-pipeline.yml"
      - ".github/workflows/seo-quality-ci.yml"
  push:
    branches:
      - main
    paths:
      - "trending_seo/**"
      - ".github/workflows/run-trending-seo-pipeline.yml"
      - ".github/workflows/seo-quality-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SEO test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests beautifulsoup4

      - name: Run SEO regression suite
        working-directory: trending_seo
        run: |
          python -m unittest \
            test_scorer.py \
            test_seo_engine.py \
            test_researcher.py \
            test_evergreen_research.py \
            test_writer.py \
            test_featured_images.py \
            test_evergreen_pipeline.py \
            test_pipeline_research_gate.py \
            test_pipeline_publish_mode.py \
            -v
