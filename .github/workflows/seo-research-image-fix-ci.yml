name: SEO Research Image Fix CI

on:
  push:
    branches:
      - fix/seo-research-image-sources

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install groq requests beautifulsoup4
      - name: Run full Evergreen SEO regression suite
        working-directory: trending_seo
        run: |
          python -m unittest \
            test_scorer.py \
            test_seo_engine.py \
            test_researcher.py \
            test_evergreen_research.py \
            test_writer.py \
            test_featured_images.py \
            test_research_image_sources.py \
            test_evergreen_pipeline.py \
            test_pipeline_research_gate.py \
            test_pipeline_publish_mode.py \
            -v
