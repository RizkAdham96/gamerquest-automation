name: GamerQuest SEO Volume Run Now

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seo-volume-run-now.yml"

permissions:
  contents: write

concurrency:
  group: gamerquest-groq-global
  cancel-in-progress: false

jobs:
  run-seo-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests beautifulsoup4

      - name: Compile SEO automation
        run: |
          python -m py_compile \
            trending_seo/discover_topics.py \
            trending_seo/scorer.py \
            trending_seo/pipeline.py

      - name: Run SEO regression tests
        working-directory: trending_seo
        run: |
          python -m unittest \
            test_scorer.py \
            test_seo_engine.py \
            test_researcher.py \
            test_evergreen_research.py \
            test_writer.py \
            test_featured_images.py \
            test_evergreen_pipeline.py \
            test_pipeline_research_gate.py \
            test_pipeline_publish_mode.py \
            -v

      - name: Refill fresh gaming SEO topics
        run: |
          # Discovery is deliberately token-free.
          python trending_seo/discover_topics.py

      - name: Reserve shared Groq budget
        id: groq_budget
        run: |
          python groq_budget.py reserve-run \
            --lane seo \
            --tokens 7000 \
            --reservation-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-seo-volume" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Persist Groq budget reservation before AI calls
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        run: |
          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"
          git add state/groq_budget.json
          git commit -m "budget: reserve SEO volume allowance" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish SEO articles
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_RUN_TOKEN_BUDGET: ${{ steps.groq_budget.outputs.tokens }}
          GROQ_TPM_CEILING: "6000"
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python trending_seo/pipeline.py

      - name: Shared Groq ceiling reached
        if: ${{ steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "SEO volume run skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"

      - name: Save SEO state
        if: always()
        run: |
          git config user.name "GamerQuest Bot"
          git config user.email "actions@github.com"

          git add trending_seo/intel/topics.json 2>/dev/null || true
          git add trending_seo/scored_topics.json 2>/dev/null || true
          git add trending_seo/research_results.json 2>/dev/null || true
          git add trending_seo/pipeline_result.json 2>/dev/null || true
          git add trending_seo/seo_intent_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No SEO state changes to save."
          else
            git commit -m "Update Trending SEO pipeline state"
            git stash push --include-untracked -m "gamerquest-seo-volume-pre-rebase" || true
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            git stash pop || true
          fi

# rerun after retry and taxonomy fixes
