name: Social CTA Fix CI

on:
  push:
    branches:
      - fix/social-clean-cta

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow requests
      - name: Run CTA regression
        env:
          PYTHONPATH: .
        run: python tests/social/test_cta_cleaner.py
