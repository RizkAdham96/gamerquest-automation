name: Social Image Regression Check

on:
  push:
    paths:
      - ".github/workflows/social-image-regression.yml"
      - "tests/social/test_render_fallback_source_image.py"
      - "social/render_fallback.py"
      - "social/renderer.py"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow requests
      - env:
          PYTHONPATH: .
        run: python tests/social/test_render_fallback_source_image.py

      - name: Verify real Zelda source and image quality
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from io import BytesIO
          import urllib.request
          from PIL import Image
          from social.render_fallback import resolve_featured_images

          source_id = "64021e5d7e5f64e9a3efefe6a3c04d712e5019be42041456988b237e2050f43b"
          images = resolve_featured_images(source_id)
          print("Resolved images:")
          for image_url in images:
              print(image_url)
              request = urllib.request.Request(image_url, headers={"User-Agent": "GamerQuest-Social/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
              with Image.open(BytesIO(raw)) as image:
                  width, height = image.size
              print(f"  dimensions: {width}x{height}")
              assert width >= 600, (image_url, width, height)
              assert height >= 300, (image_url, width, height)
          assert len(images) == 3
          assert len(set(images)) == 3
          PY

      - name: Verify full Zelda carousel renders three different slides
        env:
          PYTHONPATH: .
        run: |
          cat > social-output.json <<'JSON'
          {
            "status": "ready",
            "fact_checked": true,
            "source_id": "64021e5d7e5f64e9a3efefe6a3c04d712e5019be42041456988b237e2050f43b",
            "carousel": {
              "category": "NEWS",
              "slides": [
                {"label": "NEWS", "title": "Ocarina of Time revient sur Switch 2 !", "body": "Le Direct du 40e anniversaire de Zelda a confirmé la sortie du remake sur Nintendo Switch 2."},
                {"title": "Sortie officielle le 5 novembre 2026", "body": "Le remake sera disponible sur Nintendo Switch 2 le 5 novembre 2026."},
                {"title": "Éditions spéciales à découvrir", "body": "Plusieurs annonces et éditions spéciales ont accompagné le Direct."}
              ]
            }
          }
          JSON
          python -m social.render_fallback
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image

          paths = sorted(Path("social-rendered").glob("slide-*.png"))
          assert len(paths) == 3
          hashes = []
          for path in paths:
              raw = path.read_bytes()
              hashes.append(sha256(raw).hexdigest())
              with Image.open(path) as image:
                  print(path, image.size, len(raw))
                  assert image.size == (1080, 1350)
                  assert len(raw) > 100000
          assert len(set(hashes)) == 3
          print("Three distinct 1080x1350 slides verified.")
          PY
