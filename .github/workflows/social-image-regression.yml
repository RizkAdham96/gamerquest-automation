name: Social Image Regression Check

on:
  push:
    paths:
      - ".github/workflows/social-image-regression.yml"
      - "tests/social/test_render_fallback_source_image.py"
      - "social/render_fallback.py"
      - "social/renderer.py"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow requests
      - env:
          PYTHONPATH: .
        run: python tests/social/test_render_fallback_source_image.py
      - name: Verify real Zelda source has 3 distinct visuals
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from social.render_fallback import resolve_featured_images
          source_id = "64021e5d7e5f64e9a3efefe6a3c04d712e5019be42041456988b237e2050f43b"
          images = resolve_featured_images(source_id)
          print("Resolved images:")
          for image in images:
              print(image)
          assert len(images) == 3
          assert len(set(images)) == 3
          PY
