name: Social Production Smoke Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/social-production-smoke-once.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow requests
      - name: Run social regression tests
        env:
          PYTHONPATH: .
        run: |
          python tests/social/test_run_ai.py
          python tests/social/test_renderer.py
          python tests/social/test_meta_publisher.py
          python tests/social/test_prepare_publish.py
          python tests/social/test_publish_run.py
      - name: Generate real social content
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m social.run
      - name: Render three real carousel images
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m social.render
      - name: Verify carousel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          output = json.loads(Path('social-output.json').read_text(encoding='utf-8'))
          if output.get('status') != 'ready':
              raise SystemExit(f"Social generation not ready: {output.get('status')} {output.get('reason','')}")
          if output.get('fact_checked') is not True:
              raise SystemExit('Social output is not fact checked')

          files = sorted(Path('social-rendered').glob('slide-*.png'))
          if len(files) != 3:
              raise SystemExit(f'Expected 3 rendered slides, found {len(files)}')
          for path in files:
              with Image.open(path) as image:
                  if image.size != (1080, 1350):
                      raise SystemExit(f'Wrong size for {path}: {image.size}')
          carousel = output.get('carousel', {})
          print('Topic:', carousel.get('topic'))
          print('Caption:', carousel.get('caption'))
          print('CTA:', carousel.get('cta'))
          print('Slides:', len(carousel.get('slides', [])))
          print('Rendered files:', [str(p) for p in files])
          PY
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamerquest-social-smoke
          path: |
            social-output.json
            social-rendered/
            social-generated/
            social/openai_image_usage.json
          if-no-files-found: warn
