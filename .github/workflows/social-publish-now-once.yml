name: GamerQuest One-Time Carousel Publish Now

on:
  push:
    paths:
      - ".github/workflows/social-publish-now-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production-social:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current production social workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run social-test.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f publish_to_meta=true
