name: GamerQuest Social Publish Recovery

on:
  workflow_dispatch:
  schedule:
    # Primary social automation runs at 18:30 Europe/Paris.
    # Recovery waits 45 minutes and only runs if Instagram did not publish today.
    - cron: "15 19 * * 2,5"
      timezone: "Europe/Paris"

permissions:
  contents: write

concurrency:
  group: gamerquest-groq-global
  cancel-in-progress: false

jobs:
  recovery-check:
    runs-on: ubuntu-latest
    outputs:
      should_recover: ${{ steps.guard.outputs.should_recover }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether Instagram already published today
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          history_path = Path("social/publish_history.json")
          today = datetime.now(ZoneInfo("Europe/Paris")).date()
          published_today = False

          if history_path.exists():
              try:
                  history = json.loads(history_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"Could not read publish history: {exc}")
                  history = {}

              if isinstance(history, dict):
                  for source_id, state in history.items():
                      if not isinstance(state, dict):
                          continue
                      instagram = state.get("instagram", {})
                      if not isinstance(instagram, dict):
                          continue
                      if instagram.get("published") is not True:
                          continue
                      stamp = str(instagram.get("published_at_utc", "")).strip()
                      if not stamp:
                          continue
                      try:
                          dt = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                      except ValueError:
                          continue
                      if dt.astimezone(ZoneInfo("Europe/Paris")).date() == today:
                          print(f"Instagram already published today: {source_id} at {stamp}")
                          published_today = True
                          break

          should_recover = not published_today
          print(f"Recovery required: {should_recover}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  f"should_recover={'true' if should_recover else 'false'}\n"
              )
          PY

  recover-social-publish:
    needs: recovery-check
    if: ${{ needs.recovery-check.outputs.should_recover == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install social dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow requests

      - name: Run critical social tests
        env:
          PYTHONPATH: .
        run: |
          python tests/social/test_meta_publisher.py
          python tests/social/test_prepare_publish.py
          python tests/social/test_publish_run.py
          python tests/social/test_render_fallback_source_image.py
          python tests/social/test_run_fresh.py
          python tests/social/test_renderer.py

      - name: Meta publishing preflight
        env:
          PYTHONPATH: .
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m social.meta_healthcheck

      - name: Reserve shared Groq budget
        id: groq_budget
        run: |
          python groq_budget.py reserve-run \
            --lane social \
            --tokens 8000 \
            --reservation-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-social-recovery" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Persist Groq budget reservation before AI calls
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        run: |
          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"
          git add state/groq_budget.json
          git commit -m "budget: reserve Social recovery allowance" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Shared Groq ceiling reached
        if: ${{ steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "Social recovery AI skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"
          echo "No image/render quality setting was reduced."

      - name: Generate fresh social carousel content
        if: ${{ steps.groq_budget.outputs.allowed == 'true' }}
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_RUN_TOKEN_BUDGET: ${{ steps.groq_budget.outputs.tokens }}
          GROQ_TPM_CEILING: "6000"
        run: python -m social.run_fresh

      - name: Require a publishable carousel
        id: social_status
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("social-output.json")
          ready = False
          if path.exists():
              payload = json.loads(path.read_text(encoding="utf-8"))
              ready = payload.get("status") == "ready"
          print(f"Carousel ready: {ready}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Stop safely if no publishable story exists
        if: ${{ steps.social_status.outputs.ready != 'true' }}
        run: echo "No fresh story passed the publishing gates; recovery ends without publishing."

      - name: Render carousel without destructive cropping
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
        run: python -m social.render_fallback

      - name: Prepare public carousel images
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python -m social.prepare_publish_run

      - name: Verify three rendered images
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          test "$(find social-rendered -type f -name 'slide-*.png' | wc -l)" -eq 3
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = sorted(Path("social-rendered").glob("slide-*.png"))
          assert len(paths) == 3
          for path in paths:
              with Image.open(path) as image:
                  assert image.size == (1920, 1080), (path, image.size)
                  print(path, image.size, path.stat().st_size)
          PY

      - name: Commit prepared carousel
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          git config user.name "GamerQuest Social Bot"
          git config user.email "actions@github.com"
          git add social-published/
          if ! git diff --cached --quiet; then
            git commit -m "social: prepare recovery carousel"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Publish carousel to Instagram and Facebook
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
          META_IG_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m social.publish_run_facebook_login

      - name: Commit Meta publish history
        if: ${{ always() && steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          git config user.name "GamerQuest Social Bot"
          git config user.email "actions@github.com"
          if [ -f social/publish_history.json ]; then
            git add social/publish_history.json
            if ! git diff --cached --quiet; then
              git commit -m "social: update Meta publish history (recovery)"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
