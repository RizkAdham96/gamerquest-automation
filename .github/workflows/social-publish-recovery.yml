name: GamerQuest Social Publish Recovery

on:
  workflow_dispatch:
  schedule:
    # Primary social automation runs at 18:30 Europe/Paris.
    # Recovery waits 45 minutes and retries only the already-prepared carousel.
    - cron: "15 19 * * 2,5"
      timezone: "Europe/Paris"

permissions:
  contents: write

concurrency:
  group: gamerquest-repo-write-global
  cancel-in-progress: false

jobs:
  recovery-check:
    runs-on: ubuntu-latest
    outputs:
      should_recover: ${{ steps.guard.outputs.should_recover }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check whether Instagram already published today
        id: guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          history_path = Path("social/publish_history.json")
          today = datetime.now(ZoneInfo("Europe/Paris")).date()
          published_today = False

          if history_path.exists():
              try:
                  history = json.loads(history_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"Could not read publish history: {exc}")
                  history = {}

              if isinstance(history, dict):
                  for source_id, state in history.items():
                      if not isinstance(state, dict):
                          continue
                      instagram = state.get("instagram", {})
                      if not isinstance(instagram, dict) or instagram.get("published") is not True:
                          continue
                      stamp = str(instagram.get("published_at_utc", "")).strip()
                      if not stamp:
                          continue
                      try:
                          dt = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                      except ValueError:
                          continue
                      if dt.astimezone(ZoneInfo("Europe/Paris")).date() == today:
                          print(f"Instagram already published today: {source_id} at {stamp}")
                          published_today = True
                          break

          should_recover = not published_today
          print(f"Recovery required: {should_recover}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_recover={'true' if should_recover else 'false'}\n")
          PY

  recover-social-publish:
    needs: recovery-check
    if: ${{ needs.recovery-check.outputs.should_recover == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install recovery dependencies
        run: python -m pip install requests

      - name: Run recovery regression tests
        env:
          PYTHONPATH: .
        run: |
          python tests/social/test_prepare_publish.py
          python tests/social/test_publish_run.py
          python tests/social/test_meta_healthcheck.py

      - name: Meta publishing preflight
        id: meta_preflight
        env:
          PYTHONPATH: .
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m social.meta_healthcheck

      - name: Restore latest prepared unpublished carousel
        id: recovery_package
        env:
          PYTHONPATH: .
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: python -m social.recover_prepared_publish

      - name: No prepared carousel requires recovery
        if: ${{ steps.recovery_package.outputs.ready != 'true' }}
        run: |
          echo "Social recovery skipped safely."
          echo "Reason: ${{ steps.recovery_package.outputs.reason }}"

      - name: Retry Meta publish from committed carousel
        id: meta_publish
        if: ${{ steps.recovery_package.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
          META_IG_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m social.publish_run_facebook_login

      - name: Commit Meta publish history
        if: ${{ always() && steps.recovery_package.outputs.ready == 'true' }}
        shell: bash
        run: |
          git config user.name "GamerQuest Social Bot"
          git config user.email "actions@github.com"
          if [ -f social/publish_history.json ]; then
            git add social/publish_history.json
            if ! git diff --cached --quiet; then
              git commit -m "social: update Meta publish history (recovery)"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi

      - name: Report recovery result
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## GamerQuest Social recovery" >> "${GITHUB_STEP_SUMMARY}"
          echo "Prepared package: ${{ steps.recovery_package.outputs.ready }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Reason: ${{ steps.recovery_package.outputs.reason }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Meta preflight: ${{ steps.meta_preflight.outcome }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Meta publish: ${{ steps.meta_publish.outcome }}" >> "${GITHUB_STEP_SUMMARY}"
