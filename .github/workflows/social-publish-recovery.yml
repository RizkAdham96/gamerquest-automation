name: GamerQuest Social Publish Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamerquest-social-publishing
  cancel-in-progress: false

jobs:
  recover-social-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install social dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow requests

      - name: Run critical social tests
        env:
          PYTHONPATH: .
        run: |
          python tests/social/test_meta_publisher.py
          python tests/social/test_prepare_publish.py
          python tests/social/test_publish_run.py
          python tests/social/test_render_fallback_source_image.py

      - name: Generate social carousel content
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m social.run

      - name: Require a publishable carousel
        id: social_status
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("social-output.json")
          ready = False
          if path.exists():
              payload = json.loads(path.read_text(encoding="utf-8"))
              ready = payload.get("status") == "ready"
          print(f"Carousel ready: {ready}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Render carousel with exact article image
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
        run: python -m social.render_fallback

      - name: Prepare public carousel images
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python -m social.prepare_publish_run

      - name: Verify three rendered images
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          test "$(find social-rendered -type f -name 'slide-*.png' | wc -l)" -eq 3
          ls -lh social-rendered/slide-*.png

      - name: Commit prepared carousel
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          git config user.name "GamerQuest Social Bot"
          git config user.email "actions@github.com"
          git add social-published/
          if ! git diff --cached --quiet; then
            git commit -m "social: prepare recovery carousel"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Publish carousel to Instagram and Facebook
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
          META_IG_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m social.publish_run_facebook_login

      - name: Commit Meta publish history
        if: ${{ always() && steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          git config user.name "GamerQuest Social Bot"
          git config user.email "actions@github.com"
          if [ -f social/publish_history.json ]; then
            git add social/publish_history.json
            if ! git diff --cached --quiet; then
              git commit -m "social: update Meta publish history (recovery)"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
