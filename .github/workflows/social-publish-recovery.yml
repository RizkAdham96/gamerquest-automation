# Verification run for article-image fallback 2026-09-12
name: GamerQuest Social Publish Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/social-publish-recovery.yml"
  schedule:
    - cron: "15 19 * * 2,5"
      timezone: "Europe/Paris"

permissions:
  contents: write

concurrency:
  group: gamerquest-social-publishing
  cancel-in-progress: false

jobs:
  recover-social-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install social dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow requests

      - name: Run critical social tests
        env:
          PYTHONPATH: .
        run: |
          python tests/social/test_meta_publisher.py
          python tests/social/test_prepare_publish.py
          python tests/social/test_publish_run.py
          python tests/social/test_render_fallback_source_image.py

      - name: Generate social carousel content
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m social.run

      - name: Require a publishable carousel
        id: social_status
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("social-output.json")
          ready = False
          if path.exists():
              payload = json.loads(path.read_text(encoding="utf-8"))
              ready = payload.get("status") == "ready"
          print(f"Carousel ready: {ready}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Render carousel with exact article image
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
        run: python -m social.render_fallback

      - name: Verify three rendered images
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          test "$(find social-rendered -type f -name 'slide-*.png' | wc -l)" -eq 3
          ls -lh social-rendered/slide-*.png

      - name: Verification only - do not publish
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        run: echo "Render verified. Meta publishing intentionally disabled for this test run."
