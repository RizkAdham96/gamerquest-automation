name: Replace Zelda Instagram Carousel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/social-replace-zelda.yml"

permissions:
  contents: read

concurrency:
  group: gamerquest-social-publishing
  cancel-in-progress: true

jobs:
  replacement-closed:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate replacement
        run: echo "Replacement already completed; this run only cancels any duplicate in progress."
