name: One-off Corrected Instagram Republish

on:
  push:
    paths:
      - ".github/workflows/social-republish-once.yml"

permissions:
  contents: read

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Republish corrected Zelda carousel to Instagram only
        env:
          PYTHONPATH: .
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m social.republish_instagram_once
