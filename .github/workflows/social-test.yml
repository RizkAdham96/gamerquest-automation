name: GamerQuest Social Test

on:
  workflow_dispatch:

jobs:
  test-social:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install social renderer dependency
        run: |
          python -m pip install Pillow

      - name: Run social integration test
        env:
          PYTHONPATH: .
        run: |
          python tests/social/test_run_ai.py

      - name: Run social renderer test
        env:
          PYTHONPATH: .
        run: |
          python tests/social/test_renderer.py

      - name: Run real Groq social generation
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m social.run

      - name: Render social carousel images
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m social.render

      - name: Upload social output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamerquest-social-output
          path: |
            social-output.json
            social-rendered/
            social-generated/
            social/openai_image_usage.json
          if-no-files-found: warn
