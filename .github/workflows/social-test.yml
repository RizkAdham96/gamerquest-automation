name: GamerQuest Social Automation

on:
  workflow_dispatch:
    inputs:
      publish_to_meta:
        description: "Publish the carousel to Instagram and Facebook"
        required: true
        default: false
        type: boolean

  # One timezone-aware schedule: no duplicate DST cron and no runtime-hour guard.
  schedule:
    - cron: "30 18 * * 2,5"
      timezone: "Europe/Paris"

permissions:
  contents: write

concurrency:
  group: gamerquest-social-publishing
  cancel-in-progress: false

jobs:
  social-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install social dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow requests

      - name: Run critical social tests
        env:
          PYTHONPATH: .
        run: |
          python tests/social/test_run_ai.py
          python tests/social/test_renderer.py
          python tests/social/test_meta_publisher.py
          python tests/social/test_prepare_publish.py
          python tests/social/test_publish_run.py
          python tests/social/test_render_fallback_source_image.py

      - name: Generate fact-checked social carousel
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m social.run

      - name: Check social generation status
        id: social_status
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("social-output.json")
          ready = False
          status = "missing"
          reason = "missing_social_output"

          if path.exists():
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  status = str(payload.get("status", "")).strip() or "unknown"
                  ready = status == "ready"
                  reason = str(payload.get("reason", status)).strip()
              except Exception as exc:
                  status = "invalid"
                  reason = f"invalid_social_output:{exc}"

          print(f"Social generation status: {status}")
          print(f"Ready: {ready}")
          print(f"Reason/status: {reason}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
              f.write(f"status={status}\n")
          PY

      - name: No approved social post this run
        if: ${{ steps.social_status.outputs.ready != 'true' }}
        run: |
          echo "No fact-checked carousel was approved."
          echo "Publishing is skipped safely."

      # Production rendering is free and deterministic. render_fallback must
      # resolve THREE distinct relevant visuals for the exact selected source.
      # It rejects repeated images, gradient-only output, and sources that do
      # not provide enough suitable imagery, stopping before Meta publishing.
      - name: Render carousel with free GamerQuest renderer
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
        run: python -m social.render_fallback

      - name: Prepare carousel for public publishing
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python -m social.prepare_publish_run

      - name: Verify exactly three current carousel images
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          COUNT=$(find social-rendered -maxdepth 1 -type f -name "slide-*.png" | wc -l)
          echo "Current rendered PNG count: $COUNT"
          test "$COUNT" -eq 3

      - name: Commit prepared carousel
        if: ${{ steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          git config user.name "GamerQuest Social Bot"
          git config user.email "actions@github.com"
          git add social-published/

          if git diff --cached --quiet; then
            echo "No new carousel files to commit."
          else
            git commit -m "social: prepare carousel for publishing"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      # Scheduled runs publish automatically. Manual runs publish only when the
      # explicit publish_to_meta input is enabled.
      - name: Publish carousel to Instagram and Facebook
        if: ${{ steps.social_status.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.publish_to_meta == true) }}
        env:
          PYTHONPATH: .
          # GamerQuest uses the Facebook/Page token flow for the connected
          # Instagram professional account, so Instagram is routed through the
          # Facebook Graph API by publish_run_facebook_login.
          META_IG_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m social.publish_run_facebook_login

      - name: Commit Meta publish history
        if: ${{ always() && steps.social_status.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.publish_to_meta == true) }}
        shell: bash
        run: |
          git config user.name "GamerQuest Social Bot"
          git config user.email "actions@github.com"

          if [ -f social/publish_history.json ]; then
            git add social/publish_history.json
            if ! git diff --cached --quiet; then
              git commit -m "social: update Meta publish history"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi

      - name: Upload social output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gamerquest-social-output
          path: |
            social-output.json
            social-publish-ready.json
            social-rendered/
            social-published/
            social/publish_history.json
          if-no-files-found: warn
