name: GamerQuest Social Automation

on:
  workflow_dispatch:
    inputs:
      publish_to_meta:
        description: "Publish the carousel to Instagram and Facebook"
        required: true
        default: false
        type: boolean

  push:
    paths:
      - "social/**/*.py"
      - "tests/social/**/*.py"
      - ".github/workflows/social-test.yml"

  schedule:
    - cron: "30 18 * * 2,5"
      timezone: "Europe/Paris"

permissions:
  contents: write

concurrency:
  group: gamerquest-repo-write-global
  cancel-in-progress: false

jobs:
  social-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install social dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow requests

      - name: Run critical social tests
        id: social_tests
        env:
          PYTHONPATH: .
        run: |
          python tests/social/test_run_ai.py
          python tests/social/test_renderer.py
          python tests/social/test_meta_publisher.py
          python tests/social/test_prepare_publish.py
          python tests/social/test_publish_run.py
          python tests/social/test_render_fallback_source_image.py
          python tests/social/test_run_fresh.py
          python tests/social/test_meta_healthcheck.py

      - name: Meta publishing preflight
        id: meta_preflight
        if: ${{ github.event_name == 'schedule' || inputs.publish_to_meta == true }}
        env:
          PYTHONPATH: .
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m social.meta_healthcheck

      - name: Reserve and persist shared Groq budget
        if: ${{ github.event_name != 'push' }}
        id: groq_budget
        run: |
          set -euo pipefail

          git config user.name "GamerQuest Budget Bot"
          git config user.email "actions@github.com"

          reservation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-social"
          output_file="${RUNNER_TEMP}/groq-budget-output"
          : > "${output_file}"

          for attempt in 1 2 3; do
            echo "Social budget reservation attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            : > "${output_file}"
            python groq_budget.py reserve-run \
              --lane social \
              --tokens 8000 \
              --reservation-id "${reservation_id}" \
              --github-output "${output_file}"

            allowed="$(grep '^allowed=' "${output_file}" | tail -1 | cut -d= -f2- || true)"

            if [ "${allowed}" != "true" ]; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git add state/groq_budget.json
            git commit -m "budget: reserve Social Groq allowance"

            if git push origin HEAD:main; then
              cat "${output_file}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Shared budget state changed before push; recomputing safely."
          done

          echo "Unable to persist Social Groq reservation after 3 attempts." >&2
          exit 1

      - name: Shared Groq ceiling reached
        if: ${{ github.event_name != 'push' && steps.groq_budget.outputs.allowed != 'true' }}
        run: |
          echo "Social AI skipped before any Groq call."
          echo "Reason: ${{ steps.groq_budget.outputs.reason }}"
          echo "The carousel renderer and image quality settings were not changed."

      - name: Generate fact-checked social carousel
        id: social_generate
        if: ${{ github.event_name != 'push' && steps.groq_budget.outputs.allowed == 'true' }}
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_RUN_TOKEN_BUDGET: ${{ steps.groq_budget.outputs.tokens }}
          GROQ_TPM_CEILING: "6000"
        run: python -m social.run_fresh

      - name: Check social generation status
        if: ${{ github.event_name != 'push' }}
        id: social_status
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("social-output.json")
          ready = False
          status = "missing"
          reason = "social-output.json was not created"
          if path.exists():
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  status = str(payload.get("status", "")).strip() or "unknown"
                  ready = status == "ready"
                  reason = str(
                      payload.get("reason")
                      or payload.get("message")
                      or payload.get("error")
                      or f"generator status={status}"
                  ).replace("\n", " ").strip()
              except Exception as exc:
                  status = "invalid"
                  reason = f"invalid social-output.json: {exc}"
          print(f"Social generation status: {status}")
          print(f"Social generation reason: {reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
              f.write(f"status={status}\n")
              f.write(f"reason={reason}\n")
          PY

      - name: No approved social post this run
        if: ${{ github.event_name != 'push' && steps.social_status.outputs.ready != 'true' }}
        run: |
          echo "No fact-checked carousel was approved."
          echo "Status: ${{ steps.social_status.outputs.status }}"
          echo "Reason: ${{ steps.social_status.outputs.reason }}"
          echo "Publishing is skipped safely."

      - name: Render carousel with free GamerQuest renderer
        if: ${{ github.event_name != 'push' && steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
        run: python -m social.render_fallback

      - name: Prepare carousel for public publishing
        if: ${{ github.event_name != 'push' && steps.social_status.outputs.ready == 'true' }}
        env:
          PYTHONPATH: .
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python -m social.prepare_publish_run

      - name: Verify exactly three current carousel images
        if: ${{ github.event_name != 'push' && steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          COUNT=$(find social-rendered -maxdepth 1 -type f -name "slide-*.png" | wc -l)
          echo "Current rendered PNG count: $COUNT"
          test "$COUNT" -eq 3
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image

          paths = sorted(Path("social-rendered").glob("slide-*.png"))
          assert len(paths) == 3

          hashes = []
          for path in paths:
              raw = path.read_bytes()
              hashes.append(sha256(raw).hexdigest())
              with Image.open(path) as image:
                  assert image.format == "PNG", (path, image.format)
                  assert image.size == (1080, 1920), (path, image.size)
              assert len(raw) > 100_000, (path, len(raw))
              print(path, len(raw))

          assert len(set(hashes)) == 3, "Rendered slides are byte-identical."

          payload = json.loads(
              Path("social-publish-ready.json").read_text(encoding="utf-8")
          )
          assert len(payload.get("image_urls", [])) == 3
          assert len(set(payload["image_urls"])) == 3
          assert payload.get("carousel_version")
          print(f"Carousel version: {payload['carousel_version']}")
          PY

      - name: Commit prepared carousel
        if: ${{ github.event_name != 'push' && steps.social_status.outputs.ready == 'true' }}
        shell: bash
        run: |
          git config user.name "GamerQuest Social Bot"
          git config user.email "actions@github.com"
          git add social-published/
          if git diff --cached --quiet; then
            echo "No new carousel files to commit."
          else
            git commit -m "social: prepare carousel for publishing"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Snapshot whether Meta publish is actually pending
        id: meta_pending
        if: ${{ steps.social_status.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.publish_to_meta == true) }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          ready = json.loads(Path("social-publish-ready.json").read_text(encoding="utf-8"))
          source_id = str(ready.get("source_id", "")).strip()
          version = str(ready.get("carousel_version", "")).strip()
          if not source_id or not version:
              raise SystemExit("publish-ready payload is missing source_id/carousel_version")

          history_path = Path("social/publish_history.json")
          history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else {}
          entry = history.get(source_id, {}) if isinstance(history, dict) else {}

          pending = []
          for platform in ("instagram", "facebook"):
              state = entry.get(platform, {}) if isinstance(entry, dict) else {}
              already = bool(state.get("published")) and str(state.get("carousel_version", "")).strip() == version
              if not already:
                  pending.append(platform)

          count = len(pending)
          print(f"Meta publish pending platforms: {pending or ['none']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"pending_count={count}\n")
              f.write(f"pending_platforms={','.join(pending)}\n")
          PY

      - name: Publish carousel to Instagram and Facebook
        id: meta_publish
        if: ${{ steps.social_status.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.publish_to_meta == true) }}
        env:
          PYTHONPATH: .
          META_IG_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python -m social.publish_run_facebook_login

      - name: Commit Meta publish history
        if: ${{ always() && steps.social_status.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.publish_to_meta == true) }}
        shell: bash
        run: |
          git config user.name "GamerQuest Social Bot"
          git config user.email "actions@github.com"
          if [ -f social/publish_history.json ]; then
            git add social/publish_history.json
            if ! git diff --cached --quiet; then
              git commit -m "social: update Meta publish history"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi

      - name: P0 social final status
        if: ${{ always() }}
        shell: bash
        run: |
          PUBLISH_REQUESTED="false"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish_to_meta }}" = "true" ]; then
            PUBLISH_REQUESTED="true"
          fi

          if [ "${{ steps.social_tests.outcome }}" = "failure" ]; then
            RESULT="FAILED"
            REASON="Critical social regression tests failed."
          elif [ "${{ github.event_name }}" = "push" ]; then
            RESULT="TEST_ONLY"
            REASON="Push event runs regression tests only; no generation or Meta publishing requested."
          elif [ "${PUBLISH_REQUESTED}" = "true" ] && [ "${{ steps.meta_preflight.outcome }}" = "failure" ]; then
            RESULT="FAILED"
            REASON="Meta preflight failed before any publishing attempt."
          elif [ "${{ steps.groq_budget.outputs.allowed }}" != "true" ]; then
            RESULT="SKIPPED"
            REASON="Groq budget unavailable: ${{ steps.groq_budget.outputs.reason }}"
          elif [ "${{ steps.social_generate.outcome }}" = "failure" ]; then
            RESULT="FAILED"
            REASON="Social generation command failed."
          elif [ "${{ steps.social_status.outputs.ready }}" != "true" ]; then
            RESULT="SKIPPED"
            REASON="Generation status=${{ steps.social_status.outputs.status }}; ${{ steps.social_status.outputs.reason }}"
          elif [ "${PUBLISH_REQUESTED}" != "true" ]; then
            RESULT="GENERATED_ONLY"
            REASON="Carousel passed generation checks; Meta publishing was not requested."
          elif [ "${{ steps.meta_publish.outcome }}" = "failure" ]; then
            RESULT="FAILED"
            REASON="Meta publish command failed. Pending platforms before publish: ${{ steps.meta_pending.outputs.pending_platforms }}"
          elif [ "${{ steps.meta_pending.outputs.pending_count }}" = "0" ]; then
            RESULT="ALREADY_PUBLISHED"
            REASON="This exact carousel version was already recorded as published on Instagram and Facebook; no new post was created."
          elif [ "${{ steps.meta_publish.outcome }}" = "success" ]; then
            RESULT="PUBLISHED"
            REASON="A publish was pending for ${{ steps.meta_pending.outputs.pending_platforms }} and the Meta publish command completed successfully."
          else
            RESULT="FAILED"
            REASON="Unexpected Meta publishing state: outcome=${{ steps.meta_publish.outcome }}, pending=${{ steps.meta_pending.outputs.pending_count }}."
          fi

          echo "SOCIAL RESULT: ${RESULT}"
          echo "SOCIAL REASON: ${REASON}"
          {
            echo "## GamerQuest Social result"
            echo "**${RESULT}**"
            echo ""
            echo "${REASON}"
            echo ""
            echo "Generation status: ${{ steps.social_status.outputs.status }}"
            echo "Meta preflight: ${{ steps.meta_preflight.outcome }}"
            echo "Meta pending before publish: ${{ steps.meta_pending.outputs.pending_platforms }}"
            echo "Meta publish: ${{ steps.meta_publish.outcome }}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${RESULT}" = "FAILED" ]; then
            exit 1
          fi

      - name: Upload social output
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gamerquest-social-output
          path: |
            social-output.json
            social-publish-ready.json
            social-rendered/
            social-published/
            social/publish_history.json
          if-no-files-found: warn
