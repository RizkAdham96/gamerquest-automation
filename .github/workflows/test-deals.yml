name: GamerQuest Deals Automation

on:
  workflow_dispatch:
  schedule:
    # Balanced production cadence: six scans per day, away from top-of-hour load.
    - cron: "37 */4 * * *"

permissions:
  contents: write

concurrency:
  group: gamerquest-repo-write-global
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect deals once and build WordPress feed
        run: python -m deals.build_feed

      - name: Save deals feed
        run: |
          git config user.name "GamerQuest Deals Bot"
          git config user.email "actions@github.com"

          git add gamerquest-deals-feed.json

          if [ -d "generated_images" ]; then
            git add generated_images/
          fi

          if git diff --cached --quiet; then
            echo "No feed or image changes to save."
          else
            git commit -m "Update GamerQuest deals feed and images"
            git stash push --include-untracked -m "gamerquest-deals-pre-rebase" || true
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            git stash pop || true
          fi

      - name: Publish deals directly to WordPress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python -m deals.publish_wordpress
