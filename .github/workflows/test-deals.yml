name: Test Deals Logic

on:
  workflow_dispatch:

jobs:
  test-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deals tests
        run: |
          python -m pytest deals/test_deals.py deals/test_steam.py -v

      - name: Scan real Steam deals
        run: |
          python -m deals.run_steam

      - name: Scan CheapShark deals
        run: |
          python -m deals.run_cheapshark
