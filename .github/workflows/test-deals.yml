name: GamerQuest Deals Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: gamerquest-deals
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deals tests
        run: |
          python -m pytest \
            deals/test_deals.py \
            deals/test_steam.py \
            deals/test_epic.py \
            deals/test_aggregator.py \
            deals/test_article_generator.py \
            deals/test_image_generator.py \
            deals/test_image_title_removed.py \
            -v

      - name: Scan real Steam deals
        run: |
          python -m deals.run_steam

      - name: Scan CheapShark deals
        run: |
          python -m deals.run_cheapshark

      - name: Scan Epic free games
        run: |
          python -m deals.run_epic

      - name: Test combined GamerQuest pipeline
        run: |
          python -m deals.run_all

      - name: Build WordPress deals feed
        run: |
          python -m deals.build_feed

      - name: Save deals feed
        run: |
          git config user.name "GamerQuest Deals Bot"
          git config user.email "actions@github.com"

          git add gamerquest-deals-feed.json

          if [ -d "generated_images" ]; then
            git add generated_images/
          fi

          if git diff --cached --quiet; then
            echo "No feed or image changes to save."
          else
            git commit -m "Update GamerQuest deals feed and images"
            git push
          fi

      - name: Trigger WordPress Deals import
        env:
          WP_DEALS_TRIGGER_TOKEN: ${{ secrets.WP_DEALS_TRIGGER_TOKEN }}
        run: |
          if [ -z "$WP_DEALS_TRIGGER_TOKEN" ]; then
            echo "::error::Missing GitHub secret WP_DEALS_TRIGGER_TOKEN"
            exit 1
          fi

          if [ ! -s gamerquest-deals-feed.json ]; then
            echo "::error::gamerquest-deals-feed.json is missing or empty"
            exit 1
          fi

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --header "X-GamerQuest-Deals-Token: $WP_DEALS_TRIGGER_TOKEN" \
            --data-binary "@gamerquest-deals-feed.json" \
            "https://gamerquestfr.com/wp-json/gamerquest/v1/deals/import"

          echo
          echo "WordPress Deals import triggered successfully."
