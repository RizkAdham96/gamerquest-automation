name: GamerQuest Deals Automation

on:
  workflow_dispatch:

  # Run automatically every 2 hours
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: gamerquest-deals
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deals tests
        run: |
          python -m pytest \
            deals/test_deals.py \
            deals/test_steam.py \
            deals/test_epic.py \
            deals/test_aggregator.py \
            deals/test_article_generator.py \
            -v

      - name: Scan real Steam deals
        run: |
          python -m deals.run_steam

      - name: Scan CheapShark deals
        run: |
          python -m deals.run_cheapshark

      - name: Scan Epic free games
        run: |
          python -m deals.run_epic

      - name: Test combined GamerQuest pipeline
        run: |
          python -m deals.run_all

      - name: Build WordPress deals feed
        run: |
          python -m deals.build_feed

      - name: Save deals feed
        run: |
          git config user.name "GamerQuest Deals Bot"
          git config user.email "actions@github.com"

          git add gamerquest-deals-feed.json

          if git diff --cached --quiet; then
            echo "No feed changes to save."
          else
            git commit -m "Update GamerQuest deals feed"
            git push
          fi

      - name: Trigger WordPress deal import
        env:
          WORDPRESS_DEALS_TRIGGER_URL: ${{ secrets.WORDPRESS_DEALS_TRIGGER_URL }}
        run: |
          echo "Triggering GamerQuest WordPress importer..."

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --retry 2 \
            --header "User-Agent: GamerQuest-GitHub-Actions/1.0" \
            "$WORDPRESS_DEALS_TRIGGER_URL")

          echo "WordPress response:"
          echo "$RESPONSE"

          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("RESPONSE", "")

          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("ERROR: WordPress did not return valid JSON.")
              sys.exit(1)

          if data.get("ok") is not True:
              print("ERROR: WordPress importer returned a failure.")
              print(data)
              sys.exit(1)

          print("WordPress trigger succeeded.")
          print(f"Feed: {data.get('feed', 0)}")
          print(f"Imported: {data.get('imported', 0)}")
          print(f"Skipped: {data.get('skipped', 0)}")
          print(f"Errors: {data.get('errors', 0)}")
          PY
