name: Test Trending SEO

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Run Trending SEO tests
        working-directory: trending_seo
        run: |
          python -m unittest test_scorer.py test_researcher.py test_writer.py test_writer_v4.py test_writer_v5.py -v
